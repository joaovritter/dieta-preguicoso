services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dieta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-dieta}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dieta} -d ${POSTGRES_DB:-dieta}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Exposta só em localhost, para o backend rodar fora do Docker em dev (`npm run dev`).
    # Porta 5433 porque a 5432 já está ocupada por um Postgres nativo nesta máquina.
    # Na VPS isso não expõe nada à internet: 127.0.0.1 não é alcançável de fora.
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-dieta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dieta}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-30d}
      IA_PROVEDOR: ${IA_PROVEDOR:-openai}
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash}
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL_TEXTO: ${OPENAI_MODEL_TEXTO:-gpt-4o}
      OPENAI_MODEL_VISAO: ${OPENAI_MODEL_VISAO:-gpt-4o}
      OPENAI_MODEL_AUDIO: ${OPENAI_MODEL_AUDIO:-whisper-1}
      DIR_UPLOADS: /app/uploads
      RETENCAO_MIDIA_DIAS: ${RETENCAO_MIDIA_DIAS:-30}
      TIMEZONE_PADRAO: ${TIMEZONE_PADRAO:-America/Sao_Paulo}
      PERMITIR_CADASTRO: ${PERMITIR_CADASTRO:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - midias:/app/uploads
    # Idem: só o nginx fala com a API.

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Sem HTTPS, esta é a única porta exposta na VPS (troque a da esquerda se 8080
      # já estiver em uso). Com o perfil `https`, ponha BIND_PUBLICO=127.0.0.1 no .env:
      # aí só o Caddy alcança o app, e a 8080 deixa de existir para a internet.
      - '${BIND_PUBLICO:-0.0.0.0}:${PORTA_PUBLICA:-8080}:80'

  # Só sobe com `docker compose --profile https up -d`. Enquanto não houver domínio,
  # este serviço fica fora do caminho.
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      # Vem do .env. Vazio aqui só importa se você subir este perfil sem definir.
      DOMINIO: '${DOMINIO:-}'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados moram aqui. Perder este volume = pedir certificado de novo,
      # e o Let's Encrypt limita quantas vezes por semana isso pode acontecer.
      - certificados:/data
      - config-caddy:/config

volumes:
  dados-postgres:
  midias:
  certificados:
  config-caddy:
