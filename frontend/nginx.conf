server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads de foto e áudio chegam por aqui; o default do nginx (1M) barraria.
  client_max_body_size 30m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets do Vite têm hash no nome: podem ser cacheados agressivamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A IA pode levar dezenas de segundos para responder sobre uma foto.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }

  # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
